<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LORD 2.0</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-container">

    <div class="topbar">
        <h1>LORD 2.0 — USDT Transfers</h1>
        <button class="logout-btn">Logout</button>
    </div>

    <div class="dashboard-grid">

        <!-- BALANCE -->
        <div class="card">
            <h2>Balance</h2>
            <div class="balance-value">0.00 USDT</div>
        </div>

        <!-- ADDRESS -->
        <div class="card">
            <h2>Your Address</h2>
            <p>LORD_xxxxxxxxxxxxxxxxx</p>
        </div>

        <!-- SEND -->
        <div class="card">
            <h2>Send USDT</h2>
            <input type="text" placeholder="Receiver address">
            <input type="number" placeholder="Amount (USDT)">
            <button class="primary-btn">Send</button>
        </div>

        <!-- EXPLORER -->
        <div class="card">
            <h2>Explorer</h2>
            <input type="text" placeholder="TX Hash">
            <button class="primary-btn">Check</button>
        </div>

    </div>

    <!-- HISTORY -->
    <div class="card history">
        <h2>Transaction History</h2>
        <p>No transactions yet</p>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>
